<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Facturación</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#1e293b;
    margin:0;
    color:white;
}

header{
    background:#0f172a;
    padding:20px;
    text-align:center;
}

.container{
    width:80%;
    margin:30px auto;
}

.card{
    background:white;
    color:black;
    padding:20px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    background:#f97316;
    color:white;
    border:none;
    padding:12px 20px;
    cursor:pointer;
    border-radius:5px;
}

.features{
    margin-top:20px;
}

.features div{
    background:#334155;
    padding:15px;
    margin:10px 0;
    border-radius:8px;
}
</style>
</head>

<body>

<header>
    <h1>💰 Sistema de Facturación</h1>
    <p>MVP - Producto Mínimo Viable</p>
</header>

<div class="container">

<div class="card">
    <h2>Crear Factura</h2>

    <input type="text" placeholder="Nombre del cliente">

    <input type="number" placeholder="Monto">

    <button>Generar Factura</button>
</div>

<div class="features">
    <div>✅ Registro de clientes</div>
    <div>✅ Generación de facturas</div>
    <div>✅ Consulta de ventas</div>
    <div>✅ Reportes básicos</div>
</div>

</div>

</body>
</html>
